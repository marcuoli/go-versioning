name: Allocate application version

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: application-version-allocation
  cancel-in-progress: false

jobs:
  allocate:
    if: ${{ gitea.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
          cache: false
      - run: go install github.com/marcuoli/go-versioning/cmd/go-versioning@v0.1.0
      - name: Allocate the merged version
        shell: bash
        env:
          MERGE_COMMIT: ${{ gitea.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ gitea.event.pull_request.number }}
          VERSION_MAJOR: ${{ contains(gitea.event.pull_request.labels.*.name, 'version:major') }}
          VERSION_MINOR: ${{ contains(gitea.event.pull_request.labels.*.name, 'version:minor') }}
          VERSION_PATCH: ${{ contains(gitea.event.pull_request.labels.*.name, 'version:patch') }}
        run: |
          set -eu
          bump=inherit
          count=0
          for item in major minor patch; do
            case "$item" in
              major) selected="$VERSION_MAJOR" ;;
              minor) selected="$VERSION_MINOR" ;;
              patch) selected="$VERSION_PATCH" ;;
            esac
            if [ "$selected" = true ]; then
              bump="$item"
              count=$((count + 1))
            fi
          done
          if [ "$count" -gt 1 ]; then
            echo "Multiple version labels are not allowed" >&2
            exit 1
          fi
          git fetch origin main --tags
          # Fail closed across a missing earlier allocation or an out-of-order event.
          parent="$(git rev-parse "$MERGE_COMMIT^1")"
          mapfile -t parent_tags < <(git tag --points-at "$parent" --list 'v*+*' 'build/*')
          if [ "${#parent_tags[@]}" -ne 1 ]; then
            echo 'The first parent needs exactly one application tag. Reconcile earlier merges oldest first, then rerun this event.' >&2
            exit 1
          fi
          "$(go env GOPATH)/bin/go-versioning" tag --repo . --branch main \
            --commit "$MERGE_COMMIT" --pr "$PR_NUMBER" --bump "$bump" \
            --push --remote origin --json
