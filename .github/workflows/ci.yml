name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Validate on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            bash scripts/validate.sh --race
          else
            bash scripts/validate.sh
          fi
      - name: Validate on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/validate.ps1

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build supported CLI targets
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOWORK: 'off'
          GOFLAGS: '-mod=readonly'
          GOTOOLCHAIN: 'local'
        run: |
          set -euo pipefail
          [[ "$(go env GOVERSION)" == go1.27.3 ]]
          mkdir -p bin
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            go build -trimpath -buildvcs=false -o "bin/go-versioning-${GOOS}-${GOARCH}" ./cmd/go-versioning
          done
